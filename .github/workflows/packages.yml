# Builds the riscv32 packages from aports.commit + patches/ and publishes
# them. The guide is docs/steps/23-package-ci.md; every step below says
# what it does and why.
#
# Two kinds of run:
#   a push to a branch  starts from everything published (Pages plus the
#                       newest release) and builds only what is new or
#                       changed (new pkgver or pkgrel); on main it then
#                       updates GitHub Pages
#   a pushed tag        builds everything from scratch and publishes it as
#   packages-*          the GitHub release of that tag
#
# Jobs, each on a fresh x86_64 Ubuntu machine ("runner"):
#   cross       steps 8 and 9: bootstrap.sh cross-builds the toolchain and base
#   native-1..4 step 11: builds ci/native-packages.txt in a riscv32
#               container (native.yml); a part runs only if the previous
#               one ran out of time
#   pages       puts the repository on GitHub Pages (main only)
#   release     publishes the repository as a GitHub release (tags only)

name: riscv32 packages

on:
  push:
    branches:
      - "**"
    # A tag push runs whatever changed: GitHub does not apply paths to tags
    tags:
      - packages-*
    paths:
      - aports.commit
      - patches/**
      - ci/**
      - .github/workflows/packages.yml
      - .github/workflows/native.yml
  workflow_dispatch:
    inputs:
      budget-minutes:
        description: Minutes each native part may start new packages for
        default: "300"

permissions:
  contents: read

# Runs on main wait for each other, because each builds on top of what the
# previous one published. On other branches a new push cancels the older
# run. A tag has its own group.
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The Pages address of this repository; a repository variable PACKAGES_URL
  # overrides it (Settings, Secrets and variables, Actions, Variables)
  PACKAGES_URL: ${{ vars.PACKAGES_URL }}

jobs:
  # A release made by hand on the Releases page pushes its new tag too.
  # There is nothing to build then, and the release job would find the
  # release taken.
  tag:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    outputs:
      released: ${{ steps.check.outputs.released }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::Release $GITHUB_REF_NAME exists already: nothing to build"
            echo released=true >> "$GITHUB_OUTPUT"
          fi

  # Runs when the tag job is skipped (a branch) too: !cancelled() keeps a
  # skipped dependency from skipping this job
  cross:
    needs: tag
    if: ${{ !cancelled() && needs.tag.outputs.released != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      uploaded: ${{ steps.upload.outcome == 'success' }}
      temporary-key: ${{ steps.prepare.outputs.temporary-key }}
    steps:
      # This repository goes into a subdirectory, so the workspace looks like
      # the directory on the PC that holds aports and alpine-riscv32
      - uses: actions/checkout@v5
        with:
          path: alpine-riscv32

      # The runner image comes with about 14 GB free; gcc's build tree alone
      # takes several GB. These SDKs are not used here.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Prepare aports, signing key and build container
        id: prepare
        env:
          ABUILD_PRIVKEY: ${{ secrets.ABUILD_PRIVKEY }}
        run: alpine-riscv32/ci/prepare.sh

      # Sources downloaded by earlier runs, so gcc, binutils and the rest are
      # not downloaded again
      - name: Restore downloaded sources
        uses: actions/cache/restore@v5
        with:
          path: .cache/distfiles
          key: distfiles-cross-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: distfiles-cross-

      # Sources whose own server fails from the runners (ci/sources.txt)
      - name: Download sources from other copies
        run: alpine-riscv32/ci/prefetch-sources.sh

      # bootstrap.sh builds this x86_64 cross compiler first. It is of no
      # use on a board, so Pages and the releases leave it out; it is kept
      # here instead. The key changes when an APKBUILD it is built from
      # changes. Not with a temporary key: apk would not trust its index.
      # Not for a tag: a release is built from scratch.
      - name: Restore the cross compiler
        id: toolchain
        if: steps.prepare.outputs.temporary-key == 'false' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/restore@v5
        with:
          path: .local/share/abuild/main/x86_64
          key: toolchain-x86_64-${{ hashFiles('aports/main/binutils/*', 'aports/main/gcc/*', 'aports/main/build-base/*') }}

      # Pages plus the newest release. Skipped with a temporary key: its
      # packages would not be signed by the key the published ones are.
      # Skipped for a tag: a release is built from scratch.
      - name: Download the published packages
        if: steps.prepare.outputs.temporary-key == 'false' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: alpine-riscv32/ci/fetch-published.sh "${PACKAGES_URL:-https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}}" .local/share/abuild

      # abuild skips a package when its .apk files exist and are newer than
      # the APKBUILD and its sources, and the index is newer than the .apk
      # files. The checkout and the cache are newer than the download, so
      # touch the packages first and the indexes last. Changing a package
      # therefore needs a pkgrel bump, as in aports.
      # bootstrap.sh's list lacks mdev-conf, which alpine-base needs (step 9,
      # section 4), hence the second call.
      - name: Cross-build the toolchain and base system
        id: bootstrap
        continue-on-error: true
        timeout-minutes: 330
        run: |
          find .local/share/abuild -name '*.apk' -exec touch {} +
          find .local/share/abuild -name APKINDEX.tar.gz -exec touch {} +
          docker exec -u builder -w /work/aports alpine-rv32 ./scripts/bootstrap.sh riscv32
          docker exec -u builder -w /work/aports alpine-rv32 ./scripts/bootstrap.sh riscv32 mdev-conf

      # Stop the builds before saving anything, so no file is half written
      - name: Stop the container
        if: always()
        run: docker stop alpine-rv32 || true

      - name: Save downloaded sources
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .cache/distfiles
          key: distfiles-cross-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save the cross compiler
        if: >-
          steps.bootstrap.outcome == 'success'
          && steps.toolchain.outcome == 'success'
          && steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .local/share/abuild/main/x86_64
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      # Even after a failed build: what was built is kept, and published on
      # main, so the next run continues from there instead of from scratch.
      # Not when an earlier step failed (the bootstrap step then never ran):
      # the repository could be missing what was published, and Pages
      # would lose it. .apk files are already compressed.
      - name: Hand the repository to the next job
        id: upload
        if: ${{ !cancelled() && steps.bootstrap.outcome != 'skipped' }}
        uses: actions/upload-artifact@v6
        with:
          name: repo
          path: .local/share/abuild/
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

      # A temporary key exists only in this run; the native job must sign
      # with the same one, or apk would not trust these packages there
      - name: Hand the temporary key to the next job
        if: steps.prepare.outputs.temporary-key == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: temporary-key
          path: .config/abuild/alpine-riscv32-ci.rsa
          include-hidden-files: true
          retention-days: 1

      - name: Fail if the bootstrap failed
        if: steps.bootstrap.outcome != 'success'
        run: exit 1

  # Up to four native parts in a row; a part runs only when the previous
  # one handed on the repository and left packages for lack of time (or
  # was stopped in the middle of a package, which leaves "left" empty)
  # The if is needed although it only asks for cross: without a status
  # function GitHub skips this job when any job before it was skipped,
  # and on a branch the tag job always is
  native-1:
    needs: cross
    if: ${{ !cancelled() && needs.cross.result == 'success' }}
    uses: ./.github/workflows/native.yml
    secrets: inherit
    with:
      part: "1"
      temporary-key: ${{ needs.cross.outputs.temporary-key }}
      budget-minutes: ${{ inputs.budget-minutes || '300' }}

  native-2:
    needs: [cross, native-1]
    if: ${{ !cancelled() && needs.native-1.outputs.uploaded == 'true' && needs.native-1.outputs.left != '0' }}
    uses: ./.github/workflows/native.yml
    secrets: inherit
    with:
      part: "2"
      temporary-key: ${{ needs.cross.outputs.temporary-key }}
      budget-minutes: ${{ inputs.budget-minutes || '300' }}

  native-3:
    needs: [cross, native-2]
    if: ${{ !cancelled() && needs.native-2.outputs.uploaded == 'true' && needs.native-2.outputs.left != '0' }}
    uses: ./.github/workflows/native.yml
    secrets: inherit
    with:
      part: "3"
      temporary-key: ${{ needs.cross.outputs.temporary-key }}
      budget-minutes: ${{ inputs.budget-minutes || '300' }}

  native-4:
    needs: [cross, native-3]
    if: ${{ !cancelled() && needs.native-3.outputs.uploaded == 'true' && needs.native-3.outputs.left != '0' }}
    uses: ./.github/workflows/native.yml
    secrets: inherit
    with:
      part: "4"
      temporary-key: ${{ needs.cross.outputs.temporary-key }}
      budget-minutes: ${{ inputs.budget-minutes || '300' }}

  # Runs after a failed build too, so what was built is not lost; never
  # with a temporary key, and only on main (the github-pages environment
  # allows only main anyway)
  pages:
    needs: [cross, native-1, native-2, native-3, native-4]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main'
      && needs.cross.outputs.uploaded == 'true'
      && needs.cross.outputs.temporary-key == 'false' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: repo
          path: site

      # The cross compiler (x86_64) is of no use on a board and is cached
      # by the cross job instead. files.txt lists every file, because a
      # static site has no directory listing: the next run and the PC
      # download from it.
      - name: Leave out the cross compiler, add the file list and a front page
        run: |
          url=${PACKAGES_URL:-https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}}
          cd site
          rm -rf ./*/x86_64
          find . -type f | sed 's|^\./||' | sort > files.txt
          keys=
          for k in *.rsa.pub; do keys="$keys <a href=\"$k\">$k</a>"; done
          repos=$(for r in */riscv32/APKINDEX.tar.gz; do echo "$url/${r%%/*}"; done)
          cat > index.html <<EOF
          <!doctype html>
          <meta charset="utf-8">
          <title>alpine-riscv32 packages</title>
          <h1>alpine-riscv32 packages</h1>
          <p>Alpine packages for riscv32, built by GitHub Actions from
          <a href="https://github.com/${GITHUB_REPOSITORY}">${GITHUB_REPOSITORY}</a>
          at commit ${GITHUB_SHA}.</p>
          <p>Signing keys, for /etc/apk/keys on the board:${keys}.</p>
          <p>Lines for /etc/apk/repositories:</p>
          <pre>${repos}</pre>
          <p>Every file: <a href="files.txt">files.txt</a>.</p>
          EOF
          du -sh .
          wc -l files.txt

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

  # Only for a pushed packages-* tag, and only from a complete build: the
  # cross job green and the last native part that ran green with nothing
  # left. (A part that ends with nothing left is the last one: the next
  # part runs only when something was left.)
  release:
    needs: [cross, native-1, native-2, native-3, native-4]
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/packages-')
      && needs.cross.result == 'success'
      && ((needs.native-1.result == 'success' && needs.native-1.outputs.left == '0')
      || (needs.native-2.result == 'success' && needs.native-2.outputs.left == '0')
      || (needs.native-3.result == 'success' && needs.native-3.outputs.left == '0')
      || (needs.native-4.result == 'success' && needs.native-4.outputs.left == '0')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # For the release notes: aports.commit and the patch numbers
      - uses: actions/checkout@v5
        with:
          path: alpine-riscv32

      - uses: actions/download-artifact@v7
        with:
          name: repo
          path: repo

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: alpine-riscv32/ci/make-release.sh repo
