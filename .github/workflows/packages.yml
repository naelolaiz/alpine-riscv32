# Builds the riscv32 packages from aports.commit + patches/ and publishes
# them as an apk repository on GitHub Pages; when asked to, also as a GitHub
# release. The guide is docs/steps/23-package-ci.md; every step below says
# what it does and why.
#
# Four jobs, each on a fresh x86_64 Ubuntu machine ("runner"):
#   cross    steps 8 and 9: bootstrap.sh cross-builds the toolchain and base
#   native   step 11: builds ci/native-packages.txt in a riscv32 container
#   pages    puts the repository on GitHub Pages (main only, every run)
#   release  publishes it as a GitHub release (main only, and only when the
#            run was started by hand with "release" ticked)
# Each run starts from what Pages has (while it has nothing, from the
# newest packages-* release), so only new or changed packages (new pkgver
# or pkgrel) are built.

name: riscv32 packages

on:
  push:
    paths:
      - aports.commit
      - patches/**
      - ci/**
      - .github/workflows/packages.yml
  workflow_dispatch:
    inputs:
      budget-minutes:
        description: Minutes the native job may start new packages for
        default: "300"
      release:
        description: Also publish the packages as a GitHub release (main only)
        type: boolean
        default: false

permissions:
  contents: read

# Runs on main wait for each other, because each builds on top of what the
# previous one published. On other branches a new push cancels the older run.
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The Pages address of this repository; a repository variable PACKAGES_URL
  # overrides it (Settings, Secrets and variables, Actions, Variables)
  PACKAGES_URL: ${{ vars.PACKAGES_URL }}

jobs:
  cross:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      uploaded: ${{ steps.upload.outcome == 'success' }}
      temporary-key: ${{ steps.prepare.outputs.temporary-key }}
    steps:
      # This repository goes into a subdirectory, so the workspace looks like
      # the directory on the PC that holds aports and alpine-riscv32
      - uses: actions/checkout@v5
        with:
          path: alpine-riscv32

      # The runner image comes with about 14 GB free; gcc's build tree alone
      # takes several GB. These SDKs are not used here.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Prepare aports, signing key and build container
        id: prepare
        env:
          ABUILD_PRIVKEY: ${{ secrets.ABUILD_PRIVKEY }}
        run: alpine-riscv32/ci/prepare.sh

      # Sources downloaded by earlier runs, so gcc, binutils and the rest are
      # not downloaded again
      - name: Restore downloaded sources
        uses: actions/cache/restore@v4
        with:
          path: .cache/distfiles
          key: distfiles-cross-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: distfiles-cross-

      # Sources whose own server fails from the runners (ci/sources.txt)
      - name: Download sources from other copies
        run: alpine-riscv32/ci/prefetch-sources.sh

      # bootstrap.sh builds this x86_64 cross compiler first. It is of no
      # use on a board, so Pages and the releases leave it out; it is kept
      # here instead. The key changes when an APKBUILD it is built from
      # changes. Not with a temporary key: apk would not trust its index.
      - name: Restore the cross compiler
        id: toolchain
        if: steps.prepare.outputs.temporary-key == 'false'
        uses: actions/cache/restore@v4
        with:
          path: .local/share/abuild/main/x86_64
          key: toolchain-x86_64-${{ hashFiles('aports/main/binutils/*', 'aports/main/gcc/*', 'aports/main/build-base/*') }}

      # Skipped with a temporary key: its packages would not be signed by the
      # key the published ones are. apk checks every package's own signature,
      # and packages carried over keep the key they were signed with, so the
      # container trusts every key that comes with them; bootstrap.sh copies
      # /etc/apk/keys into its sysroot.
      - name: Download the published packages
        if: steps.prepare.outputs.temporary-key == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          alpine-riscv32/ci/fetch-published.sh "${PACKAGES_URL:-https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}}" .local/share/abuild
          docker exec alpine-rv32 sh -c 'cp /work/.local/share/abuild/*.rsa.pub /etc/apk/keys/ && ls /etc/apk/keys/'

      # abuild skips a package when its .apk files exist and are newer than
      # the APKBUILD and its sources, and the index is newer than the .apk
      # files. The checkout and the cache are newer than the download, so
      # touch the packages first and the indexes last. Changing a package
      # therefore needs a pkgrel bump, as in aports.
      # bootstrap.sh's list lacks mdev-conf, which alpine-base needs (step 9,
      # section 4), hence the second call.
      - name: Cross-build the toolchain and base system
        id: bootstrap
        continue-on-error: true
        timeout-minutes: 330
        run: |
          find .local/share/abuild -name '*.apk' -exec touch {} +
          find .local/share/abuild -name APKINDEX.tar.gz -exec touch {} +
          docker exec -u builder -w /work/aports alpine-rv32 ./scripts/bootstrap.sh riscv32
          docker exec -u builder -w /work/aports alpine-rv32 ./scripts/bootstrap.sh riscv32 mdev-conf

      # Stop the builds before saving anything, so no file is half written
      - name: Stop the container
        if: always()
        run: docker stop alpine-rv32 || true

      - name: Save downloaded sources
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/distfiles
          key: distfiles-cross-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save the cross compiler
        if: >-
          steps.bootstrap.outcome == 'success'
          && steps.prepare.outputs.temporary-key == 'false'
          && steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .local/share/abuild/main/x86_64
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      # Even after a failed build: what was built is kept, and published on
      # main, so the next run continues from there instead of from scratch.
      # Not when an earlier step failed (the bootstrap step then never ran):
      # the repository could be missing what was published, and Pages
      # would lose it. .apk files are already compressed.
      - name: Hand the repository to the next job
        id: upload
        if: ${{ !cancelled() && steps.bootstrap.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: repo
          path: .local/share/abuild/
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

      # A temporary key exists only in this run; the native job must sign
      # with the same one, or apk would not trust these packages there
      - name: Hand the temporary key to the next job
        if: steps.prepare.outputs.temporary-key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: temporary-key
          path: .config/abuild/alpine-riscv32-ci.rsa
          include-hidden-files: true
          retention-days: 1

      - name: Fail if the bootstrap failed
        if: steps.bootstrap.outcome != 'success'
        run: exit 1

  native:
    needs: cross
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      uploaded: ${{ steps.upload.outcome == 'success' }}
      left: ${{ steps.build.outputs.left }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: alpine-riscv32

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Get the temporary key from the cross job
        if: needs.cross.outputs.temporary-key == 'true'
        uses: actions/download-artifact@v4
        with:
          name: temporary-key
          path: .config/abuild

      - name: Prepare aports, signing key and build container
        env:
          ABUILD_PRIVKEY: ${{ secrets.ABUILD_PRIVKEY }}
        run: alpine-riscv32/ci/prepare.sh

      - name: Restore downloaded sources
        uses: actions/cache/restore@v4
        with:
          path: .cache/distfiles
          key: distfiles-native-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: distfiles-native-

      # Sources whose own server fails from the runners (ci/sources.txt)
      - name: Download sources from other copies
        run: alpine-riscv32/ci/prefetch-sources.sh

      - name: Get the repository from the cross job
        uses: actions/download-artifact@v4
        with:
          name: repo
          path: .local/share/abuild

      # Step 11, section 5: download in the x86_64 container, without
      # emulation. A failure here only warns: abuild tries again in the build.
      - name: Download the sources (x86_64)
        run: |
          sed -e 's/#.*//' alpine-riscv32/ci/native-packages.txt | while read -r p _; do
            [ -n "$p" ] || continue
            docker exec -u builder -w "/work/aports/$p" alpine-rv32 abuild fetch verify ||
              echo "::warning::could not download the sources of $p"
          done

      # Step 10, section 4 and step 11, section 1: Alpine's static
      # qemu-riscv32 and its binfmt_misc rule, registered with OCFP. F opens
      # the interpreter now, so it works inside containers; C lets setuid
      # riscv32 programs (abuild-apk) keep their rights.
      - name: Let the runner run riscv32 programs
        run: |
          docker exec alpine-rv32 apk add -q qemu-riscv32
          docker exec alpine-rv32 cp /usr/bin/qemu-riscv32 /work/qemu-riscv32-static
          docker exec alpine-rv32 cp /usr/lib/binfmt.d/qemu-riscv32.conf /work/
          [ -e /proc/sys/fs/binfmt_misc/register ] || sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc
          if [ -e /proc/sys/fs/binfmt_misc/qemu-riscv32 ]; then echo -1 | sudo tee /proc/sys/fs/binfmt_misc/qemu-riscv32; fi
          sed -e "s|/usr/bin/qemu-riscv32|$PWD/qemu-riscv32-static|" -e 's|:[A-Z]*$|:OCFP|' qemu-riscv32.conf | sudo tee /proc/sys/fs/binfmt_misc/register
          cat /proc/sys/fs/binfmt_misc/qemu-riscv32

      # Step 11, sections 2 and 3, with docker instead of podman: a riscv32
      # tree from the cross-built packages, imported as an image, run with
      # /work mounted and a user with the runner's uid. It trusts every key
      # in the repository directory: this run's and those of packages
      # carried over from earlier ones.
      - name: Build the riscv32 build container
        run: |
          docker exec alpine-rv32 sh -c 'mkdir -p /var/tmp/rv32-native/etc/apk/keys && cp /work/.local/share/abuild/*.rsa.pub /var/tmp/rv32-native/etc/apk/keys/'
          docker exec alpine-rv32 apk add -q --root /var/tmp/rv32-native --initdb --arch riscv32 --repository /work/.local/share/abuild/main alpine-baselayout busybox busybox-binsh apk-tools abuild build-base
          docker exec alpine-rv32 sh -c 'echo /work/.local/share/abuild/main > /var/tmp/rv32-native/etc/apk/repositories'
          docker exec alpine-rv32 tar -C /var/tmp/rv32-native -cf - . | docker import - rv32-native
          docker run -d --name rv32-native -v "$PWD":/work -w /work rv32-native sleep infinity
          docker exec rv32-native adduser -D -H -h /work -u "$(id -u)" builder
          docker exec rv32-native addgroup builder abuild
          docker exec -u builder rv32-native sh -c 'uname -m; gcc -dumpmachine; abuild-apk --version'

      # Same timestamps rule as in the cross job
      - name: Build natively
        id: build
        continue-on-error: true
        timeout-minutes: 340
        env:
          BUDGET_MINUTES: ${{ inputs.budget-minutes || '300' }}
        run: |
          find .local/share/abuild -name '*.apk' -exec touch {} +
          find .local/share/abuild -name APKINDEX.tar.gz -exec touch {} +
          alpine-riscv32/ci/native-build.sh

      - name: Stop the containers
        if: always()
        run: docker stop rv32-native alpine-rv32 || true

      - name: Save downloaded sources
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/distfiles
          key: distfiles-native-${{ github.run_id }}-${{ github.run_attempt }}

      # Replaces the cross job's artifact, so pages and release take the
      # newest. Not when the build step never ran: the cross job's artifact
      # stays then, and it is complete.
      - name: Hand the repository to the publishing jobs
        id: upload
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: repo
          path: .local/share/abuild/
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
          overwrite: true

      - name: Fail if a package failed
        if: steps.build.outcome != 'success'
        run: exit 1

  # Runs after a failed build too, so what was built is not lost; never
  # with a temporary key, and only on main (the github-pages environment
  # allows only main anyway)
  pages:
    needs: [cross, native]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main'
      && needs.cross.outputs.uploaded == 'true'
      && needs.cross.outputs.temporary-key == 'false' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: repo
          path: site

      # The cross compiler (x86_64) is of no use on a board and is cached
      # by the cross job instead. files.txt lists every file, because a
      # static site has no directory listing: the next run and the PC
      # download from it.
      - name: Leave out the cross compiler, add the file list and a front page
        run: |
          url=${PACKAGES_URL:-https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}}
          cd site
          rm -rf ./*/x86_64
          find . -type f | sed 's|^\./||' | sort > files.txt
          keys=
          for k in *.rsa.pub; do keys="$keys <a href=\"$k\">$k</a>"; done
          repos=$(for r in */riscv32/APKINDEX.tar.gz; do echo "$url/${r%%/*}"; done)
          cat > index.html <<EOF
          <!doctype html>
          <meta charset="utf-8">
          <title>alpine-riscv32 packages</title>
          <h1>alpine-riscv32 packages</h1>
          <p>Alpine packages for riscv32, built by GitHub Actions from
          <a href="https://github.com/${GITHUB_REPOSITORY}">${GITHUB_REPOSITORY}</a>
          at commit ${GITHUB_SHA}.</p>
          <p>Signing keys, for /etc/apk/keys on the board:${keys}.</p>
          <p>Lines for /etc/apk/repositories:</p>
          <pre>${repos}</pre>
          <p>Every file: <a href="files.txt">files.txt</a>.</p>
          EOF
          du -sh .
          wc -l files.txt

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

  # A snapshot for download, made only when asked for (Actions tab, riscv32
  # packages, Run workflow, "release" ticked) and only from a complete
  # build: both build jobs green and no package left for a later run
  release:
    needs: [cross, native]
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.release
      && github.ref == 'refs/heads/main'
      && needs.cross.outputs.temporary-key == 'false'
      && needs.native.outputs.left == '0' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # For the release notes: aports.commit and the patch numbers
      - uses: actions/checkout@v5
        with:
          path: alpine-riscv32

      - uses: actions/download-artifact@v4
        with:
          name: repo
          path: repo

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: alpine-riscv32/ci/make-release.sh repo
